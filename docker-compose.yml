services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: apollon
      POSTGRES_PASSWORD: apollon
      POSTGRES_DB: apollon
    ports:
      - "5433:5432"
    volumes:
      - apollon_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apollon -d apollon"]
      interval: 2s
      timeout: 5s
      retries: 30

  setup:
    build:
      context: .
      target: build
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://apollon:apollon@db:5432/apollon
      APOLLON_LOCAL_DB: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./sample-data:/app/sample-data:ro
    command: sh -c "npx prisma migrate deploy && npx tsx scripts/seed-sample.ts"

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    depends_on:
      setup:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://apollon:apollon@db:5432/apollon
      APOLLON_LOCAL_DB: "1"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
      APOLLON_ACCESS_PASSWORD: ${APOLLON_ACCESS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  apollon_db_data:
