services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: apollon
      POSTGRES_PASSWORD: apollon
      POSTGRES_DB: apollon
    ports: ["55432:5432"]
    volumes: ["apollon-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apollon -d apollon"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://apollon:apollon@db:5432/apollon
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-terra}
    depends_on:
      db: { condition: service_healthy }
    command: ["sh", "-c", "npm run db:migrate && npm run seed:demo && node server.js"]
volumes:
  apollon-db:
